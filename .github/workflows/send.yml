# "Send to Top Cat" on the WIP page dispatches this (Vito 11-05). It comments the verdict lines on the inbox PR
# (#12, never merged); Top Cat's Verdict runner session watches that PR, so the comment wakes it to route them.
# This repo is public: inputs carry only "#<issue> <verdict>" lines, never comment text. No secrets: github.token.
name: send
on:
  workflow_dispatch:
    inputs:
      issues:
        description: verdict lines, "#<issue> <approved|rejected|good|fix>"
        required: true
permissions: { pull-requests: write }
concurrency: { group: send, cancel-in-progress: false }
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Comment on the inbox PR
        env:
          ISSUES: ${{ inputs.issues }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if printf '%s\n' "$ISSUES" | grep -Eqv '^#[0-9]+ (approved|rejected|good|fix)$'; then echo "bad input line"; exit 1; fi
          body=$(printf 'Send from the WIP page: route these verdicts (read the newest "Vito: ... (WIP page)" comment on each private issue).\n\n%s\n' "$ISSUES" | sed 's/^#/street-creatures#/')
          gh pr comment 12 -R "$GITHUB_REPOSITORY" --body "$body"
